<!DOCTYPE html>
<html lang="{{ site.lang | default: "es-ES" }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>{{ page.title }}</title>
    
    {% seo title=false %}
    
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <link rel="shortcut icon" type="image/x-icon" href="{{ '/resources/favicon.ico' | relative_url }}">
    <link rel="stylesheet" href="{{ '/custom.css' | relative_url }}">
    
    <script src="https://unpkg.com/htmx.org@1.9.12" integrity="sha384-ujb1lZYygJmzgSwoxRggbCHcjc0rB2XoQrxeTUQyRjrOnlCoYta87iKBWq3EsdM2" crossorigin="anonymous"></script>

    <script>
        // Tema guardado por el usuario y, si no ha elegido ninguno, el del dispositivo
        (() => {
          let theme = null;
          try {
            theme = localStorage.getItem('theme');
          } catch (error) {
            // Almacenamiento bloqueado: se usa el del dispositivo
          }
          if (theme !== 'dark' && theme !== 'light') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    
  </head>

  <body>

    {% unless page.special_header %}
    <header class="main-content-future" style="margin-bottom: 0; padding-bottom: 0;">
      
      <picture>
        <source media="(max-width: 42em)" srcset="{{ '/resources/banner_web_phone.png' | relative_url }}">
        <source media="(min-width: 42em)" srcset="{{ '/resources/banner_web_desktop.png' | relative_url }}">
        <img src="{{ '/resources/banner_web_phone.png' | relative_url }}" alt="Banner">
      </picture>

      <table>
        <tr>
          <td style="text-align: center;">
            <a class="btnmenu" href="{{ '/' | relative_url }}" hx-get="{{ '/' | relative_url }}" hx-target="#content" hx-select="#content" hx-push-url="true">Home</a>
          </td>
          <td style="text-align: center;">
            <a class="btnmenu" href="{{ '/phd' | relative_url }}" hx-get="{{ '/phd' | relative_url }}" hx-target="#content" hx-select="#content" hx-push-url="true">PhD</a>
          </td>
          <td style="text-align: center;">
            <a class="btnmenu" href="{{ '/radio' | relative_url }}" hx-get="{{ '/radio' | relative_url }}" hx-target="#content" hx-select="#content" hx-push-url="true">Radio</a>
          </td>
          <td style="text-align: center;">
            <a class="btnmenu" href="{{ '/proyectos' | relative_url }}" hx-get="{{ '/proyectos' | relative_url }}" hx-target="#content" hx-select="#content" hx-push-url="true">Proyectos</a>
          </td>
        </tr>
      </table>

    </header>
    {% endunless %}

    <main class="main-content-future{% if page.special_header %} special-page{% endif %}" role="main" style="margin-top: 0; padding-top: 1rem;">
      <div id="content">
        {{ content }}
      </div>
    </main>

    <!--Common-->
    <footer class="site-footer main-content-future">
      <div class="site-footer-credits">
        <span style="color: #191c30;">
          <a class="btnmenu" id="theme-toggle-btn">Modo oscuro</a>
        </span>
        <span>
          <a class="btnmenu" href="/about">MRS, 2026</a>
        </span>
      </div>
    </footer>

    <button onclick="topFunction()" id="myBtn" title="Go to top">Top</button>
    <script>
      // When the user scrolls down from the top of the document, show the button
      window.onscroll = function() {scrollFunction()};

      function scrollFunction() {
          if (document.body.scrollTop > 400 || document.documentElement.scrollTop > 400) {
              document.getElementById("myBtn").style.display = "block";
          } else {
              document.getElementById("myBtn").style.display = "none";
          }
      }

      // When the user clicks on the button, scroll to the top of the document
      function topFunction() {
          document.body.scrollTop = 0;
          document.documentElement.scrollTop = 0;
      }
    </script>

    <!--Common end-->

    <script>
      const toggleBtn = document.getElementById('theme-toggle-btn');

      function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        toggleBtn.textContent = theme === 'dark' ? 'Modo Claro' : 'Modo Oscuro';
      }

      // El tema inicial lo ha fijado el script del head (guardado o, si no hay, el del dispositivo)
      applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light');

      // Alternar al hacer clic: la elección se guarda y manda sobre el dispositivo
      toggleBtn.addEventListener('click', () => {
        const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        applyTheme(next);
        try {
          localStorage.setItem('theme', next);
        } catch (error) {
          // El botón sigue funcionando sin almacenamiento
        }
      });

      // Sin tema elegido, la web sigue al del dispositivo también cuando este cambia
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', event => {
        try {
          const stored = localStorage.getItem('theme');
          if (stored === 'dark' || stored === 'light') return;
        } catch (error) {
          // Sin almacenamiento no hay elección guardada
        }
        applyTheme(event.matches ? 'dark' : 'light');
      });
    </script>

    <script>
      function destacarMenuActual() {
        // Obtenemos la ruta actual (ej. "/phd" o "/") y normalizamos quitando la barra final si la tiene
        const currentPath = window.location.pathname.replace(/\/+$/, "") || "/";

        document.querySelectorAll('header .btnmenu[hx-get]').forEach(link => {
          const linkPath = new URL(link.href, window.location.origin)
            .pathname.replace(/\/+$/, "") || "/";

          link.classList.toggle('is-active', linkPath === currentPath);
        });
      }

      // Al cargar la página
      document.addEventListener('DOMContentLoaded', destacarMenuActual);

      // Al navegar mediante HTMX
      document.addEventListener('htmx:afterSettle', destacarMenuActual);

      // Al volver o avanzar con el historial del navegador
      window.addEventListener('pageshow', destacarMenuActual);

      // Al cambiar la URL mediante navegación del historial
      window.addEventListener('popstate', destacarMenuActual);

    </script>

    <script>
      // Con la web ya cargada, descarga  las otras páginas del menú
      (() => {
        const ruta = url => url.pathname.replace(/\/+$/, '') || '/';
        const retenidas = []; // evita que se descarten antes de terminar

        function urlsDeImagenes(html) {
          const doc = new DOMParser().parseFromString(html, 'text/html');
          const urls = new Set();

          doc.querySelectorAll('#content img').forEach(img => {
            let raw = img.getAttribute('src');
            const picture = img.closest('picture');

            if (picture) {
              // La primera <source> cuyo media coincide con esta pantalla
              const source = [...picture.querySelectorAll('source')]
                .find(s => !s.media || window.matchMedia(s.media).matches);
              const srcset = source && source.getAttribute('srcset');
              if (srcset) raw = srcset.split(',')[0].trim().split(/\s+/)[0];
            }

            if (raw) urls.add(new URL(raw, window.location.href).href);
          });

          return urls;
        }

        function precargar() {
          const actual = ruta(window.location);

          document.querySelectorAll('header a[hx-get]').forEach(link => {
            const url = new URL(link.href, window.location.href);
            if (ruta(url) === actual) return;

            fetch(url)
              .then(r => (r.ok ? r.text() : ''))
              .then(html => {
                urlsDeImagenes(html).forEach(src => {
                  const img = new Image();
                  img.decoding = 'async';
                  img.src = src;
                  retenidas.push(img);
                });
              })
              .catch(() => {});
          });
        }

        const cuandoLibre = window.requestIdleCallback || (fn => setTimeout(fn, 1500));
        window.addEventListener('load', () => cuandoLibre(precargar));
      })();
    </script>

    <script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "4894a1f038d945d9b0ad817b887eec18"}'></script>

  </body>
</html>
