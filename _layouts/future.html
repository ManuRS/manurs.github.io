<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>

    {% if site.google_analytics %}
      <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
      <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', '{{ site.google_analytics }}');
      </script>
    {% endif %}
    <meta charset="UTF-8">

{% seo %}
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#157878">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">

    <link rel="shortcut icon" type="image/x-icon" href="resources/favicon.ico">
    
    <link rel="stylesheet" href="custom.css">

    <script>
      // Cargar preferencia guardada o detectar preferencia del sistema
      if (storedTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        toggleBtn.textContent = 'Modo Claro';
    </script>
    
  </head>
  <body>
    
    <main id="content" class="main-content-future" role="main">

      {{ content }}

      <!--Common-->
              <footer class="site-footer">
                  <span class="site-footer-credits">
                  <text style="float: left; color: #191c30;">
                    <a class="btnmenu" id="theme-toggle-btn">Modo oscuro</a>  
                  </text>
                  <text style="float: right;">
                  	<a class="btnmenu" href="/about">MRS, 2026</a>	  
                  </text>
                  </span><br>
              </footer>

              <button onclick="topFunction()" id="myBtn" title="Go to top">Top</button>
              <script>
                  // When the user scrolls down from the top of the document, show the button
                  window.onscroll = function() {scrollFunction()};

                  function scrollFunction() {
                      if (document.body.scrollTop > 400 || document.documentElement.scrollTop > 400) {
                          document.getElementById("myBtn").style.display = "block";
                      } else {
                          document.getElementById("myBtn").style.display = "none";
                      }
                  }

                  // When the user clicks on the button, scroll to the top of the document
                  function topFunction() {
                      document.body.scrollTop = 0;
                      document.documentElement.scrollTop = 0;
                  }
              </script>
      <!--Common end-->

    </main>

    <script>
      const toggleBtn = document.getElementById('theme-toggle-btn');
      const storedTheme = localStorage.getItem('theme');

      // Cargar preferencia guardada o detectar preferencia del sistema
      if (storedTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        toggleBtn.textContent = 'Modo Claro';
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
        toggleBtn.textContent = 'Modo Oscuro';
      }

      // Alternar al hacer clic
      toggleBtn.addEventListener('click', () => {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        
        if (isDark) {
          document.documentElement.setAttribute('data-theme', 'light');
          localStorage.setItem('theme', 'light');
          toggleBtn.textContent = 'Modo Oscuro';
        } else {
          document.documentElement.setAttribute('data-theme', 'dark');
          localStorage.setItem('theme', 'dark');
          toggleBtn.textContent = 'Modo Claro';
        }
      });
    </script>

  </body>
</html>
